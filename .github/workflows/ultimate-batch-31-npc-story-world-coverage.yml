name: "Ultimate B31 preserve NPC quest story changes across host world block churn"

on:
  pull_request:
    paths:
      - '.github/workflows/ultimate-batch-31-npc-story-world-coverage.yml'
      - 'docs/ULTIMATE_BATCH_31.md'
      - 'emulator/src/core/bloodborne_server_world.cpp'
      - 'emulator/src/core/bloodborne_team.cpp'
      - 'emulator/src/core/bloodborne_team.h'
      - 'emulator/tests/bloodborne/test_bloodborne_team.cpp'
      - 'tools/re/tests/test_npc_story_block_coverage.py'
      - 'tools/ultimate/batch_31_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimate-b31-npc-story-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-exact-npc-quest-boundary:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'experiment/ultimate-batch-30-npc-death-drop-owner-20261109')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Compare against exact B30 parent and hash pin all production/test source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin experiment/ultimate-batch-30-npc-death-drop-owner-20261109:refs/remotes/origin/b30
          git diff --name-only origin/b30 HEAD > /tmp/b31-files.txt
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('tools/ultimate/batch_31_manifest.json').read_text())
          expected=set(m['changed_paths'])
          actual=set(Path('/tmp/b31-files.txt').read_text().splitlines())
          assert len(expected)==8 and expected==actual, (sorted(actual-expected),sorted(expected-actual))
          assert m['batch_id']=='B31-2026-11-09' and m['parent_pr']==62
          assert all(m['safety'].values())
          for pin in m['pinned_blobs']:
              sha=subprocess.check_output(['git','hash-object',pin['path']],text=True).strip()
              assert sha==pin['git_blob_sha1'],(pin['path'],sha)
          print('B31_EXACT_EIGHT_SOURCE_FILES_AND_SHA_PINS_PASS')
          PY
      - name: Preserve global quest flags only in blocks known on both sides
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('emulator/src/core/bloodborne_team.cpp').read_text()
          game=Path('emulator/src/core/bloodborne_server_world.cpp').read_text()
          head=Path('emulator/src/core/bloodborne_team.h').read_text()
          tests=Path('emulator/tests/bloodborne/test_bloodborne_team.cpp').read_text()
          part=src.split('std::vector<std::pair<s32, bool>> TeamStoryToFollow(',1)[1].split('bool KeptChangeYieldsToTeam(',1)[0]
          assert 'flags_per_block == 0' in part and 'shared_block(flag)' in part
          assert 'std::binary_search(before.blocks.begin()' in part
          assert 'std::binary_search(after.blocks.begin()' in part
          assert 'before.blocks != after.blocks' not in part
          assert 'u32 flags_per_block);' in head
          follow=game.split('void FollowTeamStory(',1)[1].split('bool IsTeamScreenVerb(',1)[0]
          assert 'ReadFlagStore().flags_per_block' in follow
          assert 'TeamStoryToFollow(team_story_followed, target, flags_per_block)' in follow
          assert game.count('team_story_followed = {};') >= 5
          assert 'NpcStoryChangesSurviveHostWorldBlockExpansionAndContraction' in tests
          print('B31_NPC_STORY_PARTIAL_FLAG_COVERAGE_NO_GLOBAL_REVERT_PASS')
          PY

  actual-cpp-npc-quest-regression:
    needs: source-exact-npc-quest-boundary
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable MSVC to compile exact production C++20 NPC world delta
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and test real C++20 story flag algorithm against world block churn
        shell: bash
        run: python -m unittest discover -s tools/re/tests -p 'test_npc_story_block_coverage.py' -v
      - name: Retain earlier world-lamp and story helper regression, only on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/re/tests -p 'test_team_world_lamps_regression.py' -v
      - name: No real game saves, no world/progression mutation, no full emulator rebuild
        shell: bash
        run: echo B31_REAL_CPP_SYNTHETIC_FLAGS_NOT_REAL_NPC_SPAWN_NO_SAVES_NO_FORNEX_NO_RELEASE
