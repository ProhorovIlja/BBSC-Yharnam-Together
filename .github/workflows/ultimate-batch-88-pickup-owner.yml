name: Ultimate B88 fail-closed guest pickup journal owner guard
on:
  pull_request:
    paths:
      - 'emulator/src/core/bloodborne_flags_store.cpp'
      - 'emulator/src/core/bloodborne_team.cpp'
      - 'emulator/src/core/bloodborne_team.h'
      - 'emulator/src/core/bloodborne_server_world.cpp'
      - 'emulator/src/core/bloodborne_re_internal.h'
      - 'emulator/tests/bloodborne/test_bloodborne_team.cpp'
      - 'tools/rig/scenarios.py'
      - 'tools/ultimate/test_batch_88_pickup_owner_bound.py'
      - '.github/workflows/ultimate-batch-88-pickup-owner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-extracted-production-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert real C++ game call-site, journal, and rig scenario
        shell: bash
        run: |
          python -m unittest discover -s tools/ultimate -p 'test_batch_88_pickup_owner_bound.py' -v
          python -m py_compile tools/rig/scenarios.py
      - name: Extract exact production C++ owner-name predicate
        shell: bash
        run: |
          python tools/ultimate/test_batch_88_pickup_owner_bound.py \
            --extract-native "$RUNNER_TEMP/b88-actual-owner.cpp"
      - name: Linux GCC and Clang execute actual owner-name predicate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for cxx in g++ clang++; do
            "$cxx" -std=c++23 -O2 -Wall -Wextra -Werror -pedantic \
              "$RUNNER_TEMP/b88-actual-owner.cpp" -o "$RUNNER_TEMP/b88-policy"
            "$RUNNER_TEMP/b88-policy"
          done
          echo B88_PRODUCTION_OWNER_BOUND_NATIVE_LINUX_PASS
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows MSVC execute actual owner-name predicate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++latest /EHsc /W4 "$env:RUNNER_TEMP\b88-actual-owner.cpp" /Fe:"$env:RUNNER_TEMP\b88-policy.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\b88-policy.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "B88_PRODUCTION_OWNER_BOUND_NATIVE_WINDOWS_PASS"
