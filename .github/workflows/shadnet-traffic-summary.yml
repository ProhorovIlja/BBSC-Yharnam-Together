name: ShadNet traffic-summary opt-in

on:
  pull_request:
    paths:
      - 'server/src/link_server.cpp'
      - 'server/src/server_link.cpp'
      - 'server/src/server_link.h'
      - 'server/tests/test_server_link.cpp'
      - '.github/workflows/shadnet-traffic-summary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-refusal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt6 development headers
        run: sudo apt-get update -qq && sudo apt-get install -y qt6-base-dev pkg-config
      - name: Real server link contracts: traffic summaries off/on and refusals always present
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Iserver -Iserver/src \
            "-DBLOODBORNE_SERVER_LINK_CONTRACTS=\"$PWD/server/tests/contracts/server_link_frames.txt\"" \
            server/tests/test_server_link.cpp server/src/server_link.cpp server/coop/link_crypto.cpp \
            $(pkg-config --cflags --libs Qt6Core) -o "$RUNNER_TEMP/server-link"
          "$RUNNER_TEMP/server-link"
