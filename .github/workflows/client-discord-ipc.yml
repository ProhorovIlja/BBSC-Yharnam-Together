name: Client Discord IPC framing guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'bbport/gpu/bbcoop/discord_activity.h'
      - 'bbport/gpu/bbcoop/discord_status.cpp'
      - 'bbport/tests/test_discord_activity.cpp'
      - '.github/workflows/client-discord-ipc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-activity-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run portable Discord frame/JSON fixture (Linux)
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Ibbport bbport/tests/test_discord_activity.cpp -o /tmp/test_discord_activity
          /tmp/test_discord_activity
      - name: Compile and run portable Discord frame/JSON fixture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /Ibbport bbport/tests/test_discord_activity.cpp /Fe:test_discord_activity.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./test_discord_activity.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
