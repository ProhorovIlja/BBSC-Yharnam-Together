name: RPC client worker shutdown

on:
  pull_request:
    paths:
      - 'emulator/src/core/libraries/network/rpc_bridge.*'
      - 'emulator/src/emulator.cpp'
      - 'server/tests/rpc_bridge_fixture/**'
      - 'server/tests/test_rpc_bridge_shutdown.cpp'
      - '.github/workflows/rpc-bridge-shutdown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-peer-stop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compile and run bridge lifecycle test (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -Wno-missing-field-initializers \
            -Iserver/tests/rpc_bridge_fixture -Iemulator/src -Iserver \
            server/tests/test_rpc_bridge_shutdown.cpp emulator/src/core/libraries/network/rpc_bridge.cpp \
            -o "$RUNNER_TEMP/rpc-stop"
          "$RUNNER_TEMP/rpc-stop"
      - name: Compile and run bridge lifecycle test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /Iserver\tests\rpc_bridge_fixture /Iemulator\src /Iserver server\tests\test_rpc_bridge_shutdown.cpp emulator\src\core\libraries\network\rpc_bridge.cpp /Fe:%RUNNER_TEMP%\rpc-stop.exe ws2_32.lib
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\rpc-stop.exe"
