name: Game-link restart isolation

on:
  pull_request:
    paths:
      - 'server/coop/game_link.h'
      - 'server/coop/coop_stream.h'
      - 'server/tests/test_game_link_restart.cpp'
      - 'server/tests/test_game_link_ack_window.cpp'
      - 'server/tests/test_game_link_resend.cpp'
      - '.github/workflows/game-link-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale-restart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compile and run native GameLink restart fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Wno-missing-field-initializers -Iserver \
            server/tests/test_game_link_restart.cpp -o "$RUNNER_TEMP/game-link-restart"
          "$RUNNER_TEMP/game-link-restart"
      - name: Compile and run native GameLink restart fixtures on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /EHsc /Iserver server\tests\test_game_link_restart.cpp /Fe:%RUNNER_TEMP%\game-link-restart.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\game-link-restart.exe"
      - name: Verify reliable ACK windows on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Wno-missing-field-initializers -Iserver \
            server/tests/test_game_link_ack_window.cpp -o "$RUNNER_TEMP/game-link-ack"
          "$RUNNER_TEMP/game-link-ack"
      - name: Verify reliable ACK windows on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /EHsc /Iserver server\tests\test_game_link_ack_window.cpp /Fe:%RUNNER_TEMP%\game-link-ack.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\game-link-ack.exe"
      - name: Production-header resend parity (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Wno-missing-field-initializers -Iserver \
            server/tests/test_game_link_resend.cpp -o "$RUNNER_TEMP/game-link-resend"
          "$RUNNER_TEMP/game-link-resend"
      - name: Production-header resend parity (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /EHsc /Iserver server\tests\test_game_link_resend.cpp /Fe:%RUNNER_TEMP%\game-link-resend.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\game-link-resend.exe"
