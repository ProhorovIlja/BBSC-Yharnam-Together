name: Server loadtest generator (offline only)

on:
  push:
    branches:
      - feature/server-loadtest-multi-owner-pr444
    paths:
      - 'server/loadtest/bbload.cpp'
      - '.github/workflows/server-loadtest.yml'
  pull_request:
    paths:
      - 'server/loadtest/bbload.cpp'
      - '.github/workflows/server-loadtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadnet-loadtest-verify
  cancel-in-progress: true

jobs:
  source-and-cli-contract:
    name: Five-player / multi-owner source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ensure server runtime / client untouched
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git diff --name-only origin/main HEAD > /tmp/changed_paths.txt
          cat /tmp/changed_paths.txt
          if grep -vE '^(server/loadtest/bbload\.cpp|\.github/workflows/server-loadtest\.yml)$' /tmp/changed_paths.txt; then
            echo 'UNEXPECTED_RUNTIME_OR_CLIENT_EDIT' >&2
            exit 1
          fi
      - name: Check five-hunter and multi-owner boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path("server/loadtest/bbload.cpp").read_text()
          for expression in (
            r'\{"owners",\s*"seats a team that own enemies',
            r'bool Game::Owner\(\) const \{ return seat < load.settings.owners; \}',
            r'settings.team_size = std::clamp\(parser.value\("team-size"\).toInt\(\), 2, 5\);',
            r'settings.owners = std::clamp\(parser.value\("owners"\).toInt\(\), 0,\s*settings.team_size\);',
            r'\{"team-size",\s*"players a team \(2-5\)"',
          ):
            assert re.search(expression, s), f"missing regression invariant: {expression}"
          print("LOADTEST_SOURCE_PASS five_players,owner_range,default_legacy_behavior")
          PY

  build-loadtest:
    name: Build isolated bbload executable and inspect --help
    needs: source-and-cli-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Fetch protobuf submodule only
        run: git submodule update --init --depth=1 server/externals/protobuf
      - uses: docker/setup-buildx-action@v3
      - name: Build load generator, never connect to live games
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            -f server/hosting/Dockerfile \
            --build-arg BUILD_JOBS=2 \
            --target loadtest \
            -t yharnam-bbload:offline-test .
      - name: Validate CLI offline, without game/network flags
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            yharnam-bbload:offline-test --help > /tmp/bbload-help.txt
          grep -F -- '--owners' /tmp/bbload-help.txt
          grep -F -- '--team-size' /tmp/bbload-help.txt
          grep -F -- '--owner-fps' /tmp/bbload-help.txt
          echo 'LOADTEST_OFFLINE_HELP_PASS'
      - name: Build disposable 1.4.0 server runtime
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            -f server/hosting/Dockerfile \
            --build-arg BUILD_JOBS=2 \
            --target runtime -t yharnam-shadnet:ephemeral-ci .
      - name: Five-game encrypted-link and lobby smoke (isolated, disposable)
        run: |
          set -euo pipefail
          network=shadnet-ci-isolated
          volume=shadnet-ci-disposable-worlds
          server=shadnet-ci-synthetic
          cleanup() {
            docker rm -f "$server" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$network" >/dev/null
          docker volume create "$volume" >/dev/null
          # All credentials/worlds are new and disposable, never connect production.
          # Empty HostedBuild accepts the synthetic bbload build fingerprint.
          docker run -d --name "$server" --network "$network" \
            --memory=2g --pids-limit=4096 --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/data" \
            -e SIGN_IN=open \
            yharnam-shadnet:ephemeral-ci >/dev/null
          ready=false
          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$server" 2>/dev/null || true)"
            if [ "$state" = healthy ]; then ready=true; break; fi
            if [ "$state" = unhealthy ] || [ "$state" = exited ]; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'ERROR: disposable shadNet did not become healthy' >&2
            docker logs --tail 30 "$server" >&2 || true
            exit 1
          fi
          # Sharing the server's isolated network namespace makes 127.0.0.1
          # reachable to synthetic clients and does not expose any public port.
          timeout 95s docker run --rm \
            --network "container:$server" \
            --cap-drop ALL --security-opt no-new-privileges \
            yharnam-bbload:offline-test \
            --server 127.0.0.1 --port 31314 \
            --teams 1 --team-size 5 --owners 3 \
            --seconds 55 --ramp-ms 120 --owner-fps 12 --follower-fps 4 \
            --one-address --map-changes 0 --json \
            > "$RUNNER_TEMP/five-hunters.json"
          python3 - "$RUNNER_TEMP/five-hunters.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text().strip())
          kept = {k: report.get(k) for k in (
              "games", "linked", "playing", "refused",
              "packets_sent", "packets_received", "packets_lost",
              "relay_ms_p95", "relay_ms_p99", "ping_ms_p99")}
          print("FIVE_HUNTER_LOADTEST_RESULT", json.dumps(kept, sort_keys=True))
          assert report.get("games") == 5, "unexpected team size"
          assert report.get("linked") == 5, "not all game links connected"
          assert report.get("playing") == 5, "not all five peers in game"
          assert report.get("refused") == 0, "some game links or parties were refused"
          assert report.get("packets_received", 0) > 0, "no game data relayed"
          print("FIVE_HUNTER_ISOLATED_SMOKE_PASS")
          PY
