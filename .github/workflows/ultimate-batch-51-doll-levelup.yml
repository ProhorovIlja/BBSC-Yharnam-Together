name: "Ultimate B51 Doll Level Up quick-cancel animation safety"

on:
  pull_request:
    paths:
      - 'emulator/src/core/bloodborne_party.h'
      - 'emulator/src/core/bloodborne_travel.cpp'
      - 'emulator/tests/bloodborne/test_bloodborne_flag_rules.cpp'
      - 'tools/ultimate/test_batch_51_doll_animation.py'
      - 'docs/ULTIMATE_BATCH_51.md'
      - '.github/workflows/ultimate-batch-51-doll-levelup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimate-b51-doll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify in-game Doll animations finish before clearing player guard
        shell: bash
        run: python -m unittest discover -s tools/ultimate -p 'test_batch_51_doll_animation.py' -v

  exact-cxx-class:
    needs: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and exercise actual production DollLevelUpClear under GCC and Clang
        shell: bash
        run: python tools/ultimate/test_batch_51_doll_animation.py --compile
      - name: No production saves game binaries or user state touched
        run: echo B51_PURE_GAME_SOURCE_TEST_NO_FORNEX_NO_PLAYER_SAVES
