name: "Ultimate B36 co-op launcher offline play with clean story events and shared saves"

on:
  pull_request:
    paths:
      - '.github/workflows/ultimate-batch-36-coop-offline-play.yml'
      - 'bbport/launcher/bbport_coop.py'
      - 'bbport/launcher/bbport_launcher_win.py'
      - 'bbport/run.py'
      - 'bbport/scripts/mods.py'
      - 'bbport/tests/test_coop_offline_sandbox.py'
      - 'bbport/tests/test_launcher_production.py'
      - 'docs/ULTIMATE_BATCH_36.md'
      - 'tools/ultimate/batch_36_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimate-b36-offline-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-exact-coop-offline-source:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'experiment/ultimate-batch-35-online-gameplay-patch-gate-20261109')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Exact nine files and all six immutable source/test blob identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin experiment/ultimate-batch-35-online-gameplay-patch-gate-20261109:refs/remotes/origin/b35
          git diff --name-only origin/b35 HEAD >/tmp/b36-diff
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('tools/ultimate/batch_36_manifest.json').read_text())
          actual=set(Path('/tmp/b36-diff').read_text().splitlines())
          expected=set(m['changed_paths'])
          assert len(expected)==9 and actual==expected,(sorted(actual-expected),sorted(expected-actual))
          assert m['parent_pr']==82 and m['batch_id']=='B36-2026-11-09'
          assert all(m['safety'].values())
          for pin in m['pinned_blobs']:
              sha=subprocess.check_output(['git','hash-object',pin['path']],text=True).strip()
              assert sha==pin['git_blob_sha1'],(pin['path'],sha)
          print('B36_EXACT_NINE_FILES_AND_SIX_SHA_PINS_PASS')
          PY
      - name: Guard offline co-op launch never calls network setup and never overlays co-op EMEVD
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          l=Path('bbport/launcher/bbport_launcher_win.py').read_text()
          c=Path('bbport/launcher/bbport_coop.py').read_text()
          m=Path('bbport/scripts/mods.py').read_text()
          r=Path('bbport/run.py').read_text()
          assert 'def play_coop_offline(self):' in l and 'self.play_coop_offline' in l
          section=l.split('def coop_prepare_offline(self, settings):',1)[1].split('def coop_start_offline(self, root, failed):',1)[0]
          assert 'coop_firewall' not in section and 'global_game_settings' not in section
          assert 'prepare_offline_game' in section
          assert "'BB_IGNORE_LEGACY_GAME_MODS':'1'" in c
          assert "args.append('--ignore-legacy')" in r
          assert 'include_legacy=not args.ignore_legacy' in m
          assert "for key, title, _on in CHEATS:" in l
          print('B36_OFFLINE_LAUNCH_WILL_SKIP_NETWORK_AND_COOP_EVENT_MODS_PASS')
          PY

  actual-python-offline-regressions-linux:
    needs: verify-exact-coop-offline-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production co-op offline env, game view, mods and B35 cheat mode
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s bbport/tests -p 'test_coop_offline_sandbox.py' -v
          python -m unittest discover -s bbport/tests -p 'test_patch_mode_guard.py' -v

  actual-python-offline-regressions-windows:
    needs: verify-exact-coop-offline-source
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production co-op offline env, Windows launcher flags and B35 cheat mode
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s bbport/tests -p 'test_coop_offline_sandbox.py' -v
          python -m unittest discover -s bbport/tests -p 'test_launcher_production.py' -v
          python -m unittest discover -s bbport/tests -p 'test_patch_mode_guard.py' -v
      - name: No real game or release assets
        shell: bash
        run: echo B36_SOURCE_ONLY_NO_USER_SAVE_NO_FORNEX_NO_GAME_BINARY
