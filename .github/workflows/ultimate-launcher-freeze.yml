name: Ultimate TEST real Windows frozen launcher (no release)

on:
  pull_request:
    paths:
      - '.github/workflows/ultimate-launcher-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimate-launcher-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Ensure this PR changes ONLY its standalone workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags --depth=1 origin 'experiment/ultimate-windows-launcher-smoke-20261108:refs/remotes/origin/freeze_parent'
          if ($LASTEXITCODE -ne 0) { throw 'Missing parent TEST branch' }
          $changed = @(git diff --name-only refs/remotes/origin/freeze_parent HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify diff' }
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/ultimate-launcher-freeze.yml') {
            throw "Unexpected game/launcher/server edit: $($changed -join ', ')"
          }
      - name: Install pinned frozen Windows launcher toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --only-binary=:all: 'pyinstaller==6.22.3' 'pillow==11.3.0' 'truststore==0.10.5'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PyInstaller requirements failed' }
          python -c "import PyInstaller, PIL, truststore, tkinter; assert PyInstaller.__version__ == '6.22.3'; print('PINNED_FREEZER_PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime dependency check failed' }
      - name: Freeze REAL BLauncher.exe with official port packaging inputs and TEST version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'bbsc-freeze'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $version = Join-Path $out 'blauncher-version.txt'
          python bbport/packaging/windows/version_info.py '1.4.0-test.1' $version
          if ($LASTEXITCODE -ne 0) { throw 'No version resource' }
          $base = (python -c "import sys; print(sys.base_prefix)").Trim()
          $tclFiles = @("$base\DLLs\_tkinter.pyd", "$base\DLLs\tcl86t.dll", "$base\DLLs\tk86t.dll", "$base\tcl\tcl8.6", "$base\tcl\tk8.6")
          foreach ($path in $tclFiles) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Tcl/Tk bundle path missing: $path" }
          }
          $argsList = @(
            '--noconfirm','--clean','--log-level','WARN','--onedir','--windowed','--noupx',
            '--name','BLauncher',
            '--icon',"$PWD\bbport\launcher\bloodborne.ico",
            '--version-file',$version,
            '--distpath',(Join-Path $out 'dist'),
            '--workpath',(Join-Path $out 'work'),
            '--specpath',(Join-Path $out 'spec'),
            '--paths',"$PWD\bbport\launcher",
            '--paths',"$PWD\bbport\scripts",
            '--paths',"$PWD\bbport\tools",
            '--runtime-hook',"$PWD\bbport\packaging\windows\tk_runtime_hook.py",
            '--add-binary',"$base\DLLs\_tkinter.pyd;.",
            '--add-binary',"$base\DLLs\tcl86t.dll;.",
            '--add-binary',"$base\DLLs\tk86t.dll;.",
            '--add-data',"$base\tcl\tcl8.6;_tcl_data",
            '--add-data',"$base\tcl\tk8.6;_tk_data"
          )
          foreach ($module in @(
            'argparse','base64','bisect','collections','contextlib','hashlib','json',
            're','shutil','struct','tempfile','xml.etree.ElementTree','urllib.request',
            'ctypes.wintypes','binascii','datetime','http.server','secrets','sqlite3',
            'uuid','zlib','fetch_fsr4vk','bbport_icons','truststore','tkinter',
            'tkinter.ttk','tkinter.filedialog','tkinter.messagebox','PIL.Image'
          )) { $argsList += @('--hidden-import',$module) }
          $argsList += "$PWD\bbport\launcher\bbport_launcher_win.py"
          python -m PyInstaller @argsList
          if ($LASTEXITCODE -ne 0) { throw 'Frozen launcher compilation failed' }
          $exe = Join-Path $out 'dist\BLauncher\BLauncher.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Frozen EXE missing' }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductName -ne 'BBSC: Yharnam Together TEST' -or
              $info.FileDescription -notlike '*Yharnam Together TEST*' -or
              $info.ProductVersion -notlike '1.4.0-test.1*') {
            throw "Wrong frozen executable version/product: $($info.ProductName) $($info.ProductVersion)"
          }
          Write-Host "REAL_WINDOWS_BLAUNCHER_EXE_BUILT bytes=$((Get-Item $exe).Length)"
          Write-Host "BLAUNCHER_SHA256 $((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Prove frozen boot, Tcl/Tk, Pillow, TLS and exit-code propagation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'bbsc-freeze\dist\BLauncher'
          $stage = Join-Path $env:RUNNER_TEMP 'bbsc-launcher-only'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "$dist\*" -Destination $stage -Recurse -Force
          New-Item -ItemType Directory -Path "$stage\launcher" -Force | Out-Null
          Copy-Item 'bbport\launcher\bloodborne.ico','bbport\launcher\bloodborne.png' -Destination "$stage\launcher"
          Copy-Item 'bbport\launcher\art' -Destination "$stage\launcher\art" -Recurse -Force
          $probe = Join-Path $env:RUNNER_TEMP 'freeze-probe.py'
          @'
          import json
          import os
          import sys
          import tkinter as tk
          import truststore
          from PIL import Image
          assert getattr(sys, "frozen", False)
          root = tk.Tk()
          root.withdraw()
          root.title("BBSC: Yharnam Together TEST")
          root.update_idletasks()
          root.destroy()
          assert Image.new("RGBA", (2, 2)).size == (2, 2)
          with open(os.environ["BBSC_FREEZE_RESULT"], "w", encoding="utf-8") as file:
              json.dump({"frozen": True, "tk": True}, file)
          '@ | Set-Content $probe -Encoding UTF8
          $env:BBSC_FREEZE_RESULT = Join-Path $env:RUNNER_TEMP 'freeze-result.json'
          $env:BB_DATA_DIR = Join-Path $env:RUNNER_TEMP 'freeze-empty-data'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'freeze-empty-appdata'
          New-Item -ItemType Directory -Path $env:BB_DATA_DIR,$env:APPDATA -Force | Out-Null
          $exe = Join-Path $stage 'BLauncher.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--script',$probe) -WorkingDirectory $stage -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $env:BBSC_FREEZE_RESULT)) {
            throw "Frozen launcher cannot execute synthetic Tk script (exit $($p.ExitCode))"
          }
          $v = Get-Content $env:BBSC_FREEZE_RESULT -Raw | ConvertFrom-Json
          if (-not $v.frozen -or -not $v.tk) { throw 'Frozen Tk result invalid' }
          Write-Host 'FROZEN_WINDOWS_TK_BOOT_PASS'
          $fail = Join-Path $env:RUNNER_TEMP 'freeze-nonzero.py'
          'import sys; sys.exit(37)' | Set-Content $fail -Encoding UTF8
          $p = Start-Process -FilePath $exe -ArgumentList @('--script',$fail) -WorkingDirectory $stage -Wait -PassThru
          if ($p.ExitCode -ne 37) { throw "Frozen script swallowed exit code 37: got $($p.ExitCode)" }
          Write-Host 'FROZEN_WINDOWS_EXIT_CODE_PASS'
      - name: Check private, ephemeral launcher-only zip without upload/release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'bbsc-launcher-only'
          foreach ($name in @('eboot.bin','param.sfo','shadnet.exe','shadnet.cfg','savedata.db','player.db')) {
            if (@(Get-ChildItem -Path $stage -Recurse -File -Filter $name).Count -gt 0) {
              throw "Unexpected game, user or server asset in stage: $name"
            }
          }
          if (@(Get-ChildItem -Path $stage -Recurse -File -Include '*.pkg','*.dcx','*.sl2').Count -gt 0) {
            throw 'Unexpected game/savedata archive in stage'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'BBSC-LAUNCHER-ONLY-NOT-PLAYABLE-CI.zip'
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq 'BLauncher.exe' })) {
              throw 'Launcher EXE missing from zip'
            }
          } finally { $archive.Dispose() }
          Write-Host "EPHEMERAL_LAUNCHER_ZIP_SHA256 $((Get-FileHash $zip -Algorithm SHA256).Hash)"
          Write-Host 'NO_GAME_NO_SERVER_NO_SAVES_NO_PUBLISH_PASS'
