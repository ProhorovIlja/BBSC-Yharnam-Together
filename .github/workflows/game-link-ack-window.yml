name: Game-link reliable ACK window

on:
  pull_request:
    paths:
      - 'server/coop/game_link.h'
      - 'server/tests/test_game_link_ack_window.cpp'
      - '.github/workflows/game-link-ack-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ack-window:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build and run actual GameLink protocol on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Wno-missing-field-initializers -Iserver \
            server/tests/test_game_link_ack_window.cpp -o "$RUNNER_TEMP/link-ack"
          "$RUNNER_TEMP/link-ack"
      - name: Build and run actual GameLink protocol on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W3 /EHsc /Iserver server\tests\test_game_link_ack_window.cpp /Fe:%RUNNER_TEMP%\link-ack.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\link-ack.exe"
