name: Directory HTTP and Redis contract regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/directory/directory.py'
      - 'server/directory/test_directory.py'
      - 'server/directory/requirements.txt'
      - '.github/workflows/directory-http-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact runtime Redis client and Lua-enabled test backend
        run: python -m pip install -r server/directory/requirements.txt "fakeredis[lua]>=2.23,<3"
      - name: Execute actual directory Redis and HTTP socket contract tests
        working-directory: server/directory
        run: python -m unittest -v test_directory
