name: RPC chunking and control safety

on:
  pull_request:
    paths:
      - 'server/coop/rpc_tunnel.h'
      - 'server/tests/test_rpc_message_safety.cpp'
      - '.github/workflows/rpc-message-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-message:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compile and run RPC boundary test (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -Iserver server/tests/test_rpc_message_safety.cpp -o "$RUNNER_TEMP/rpc-message"
          "$RUNNER_TEMP/rpc-message"
      - name: Compile and run RPC boundary test (Win32)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /Iserver server\tests\test_rpc_message_safety.cpp /Fe:%RUNNER_TEMP%\rpc-message.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\rpc-message.exe"
