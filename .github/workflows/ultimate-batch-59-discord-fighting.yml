name: Ultimate B59 Discord Build suffix, Fighting and co-op display
on:
  pull_request:
    paths:
      - 'bbport/gpu/bbcoop/discord_presence_policy.h'
      - 'bbport/gpu/bbcoop/discord_status.cpp'
      - 'bbport/tests/test_discord_activity.cpp'
      - 'docs/ULTIMATE_BATCH_59.md'
      - '.github/workflows/ultimate-batch-59-discord-fighting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real policy, real IPC brand and regression fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          read = lambda p: Path(p).read_text(encoding='utf-8')
          policy = read('bbport/gpu/bbcoop/discord_presence_policy.h')
          ipc = read('bbport/gpu/bbcoop/discord_status.cpp')
          tests = read('bbport/tests/test_discord_activity.cpp')
          assert 'out.details += s.build + " Build";' in policy
          assert '"Fighting " + s.boss' in policy
          assert 'out.state = "Spectating";' in policy
          assert 's.boss.empty() ? "Boss fight"' in policy
          assert '"In co-op" + party_suffix()' in policy and '"In co-op session"' not in policy
          assert 'discord_party_counter' in policy
          assert 'BBSC: Yharnam Together' in ipc
          assert 'BbHunterBuild::DiscordShort(*mask)' in ipc
          for label in ('Central Yharnam | BL 25   STR Build',
                        'Fighting Father Gascoigne (2/5)',
                        'In co-op (2/5)', 'Spectating', 'STR/ARC Build'):
              assert label in tests, label
          assert 'two controlled text rows' in read('docs/ULTIMATE_BATCH_59.md')
          PY
  compiled-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run production Discord formatter under GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            "$compiler" -std=c++20 -Wall -Wextra -Werror -pedantic -I bbport \
              bbport/tests/test_discord_activity.cpp \
              -o "/tmp/ultimate-b59-rpc-${compiler}"
            "/tmp/ultimate-b59-rpc-${compiler}"
          done
