name: ShadNet bounded UDP receiver

on:
  pull_request:
    paths:
      - 'server/src/link_server.cpp'
      - 'server/src/link_server.h'
      - 'server/src/udp_drain_slice.h'
      - 'server/src/udp_socket_drain.h'
      - 'server/tests/test_udp_drain_slice.cpp'
      - 'server/tests/test_udp_socket_drain.cpp'
      - '.github/workflows/udp-bounded-receiver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  udp-budget:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Portable receiver fairness (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic server/tests/test_udp_drain_slice.cpp -o "$RUNNER_TEMP/udp-slice"
          "$RUNNER_TEMP/udp-slice"
      - name: Portable receiver fairness (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc server\tests\test_udp_drain_slice.cpp /Fe:%RUNNER_TEMP%\udp-slice.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\udp-slice.exe"

  qt-datagram-bursts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt6
        run: sudo apt-get update -qq && sudo apt-get install -y qt6-base-dev pkg-config
      - name: Test actual Qt socket burst, oversized packets and event-loop yield
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic server/tests/test_udp_socket_drain.cpp $(pkg-config --cflags --libs Qt6Network) -o "$RUNNER_TEMP/udp-socket"
          "$RUNNER_TEMP/udp-socket"
