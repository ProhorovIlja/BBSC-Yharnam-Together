name: "Ultimate B15 combined server and client source, isolated 5-hunter validation"

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-candidate-five-hunters.yml'
      - '.github/workflows/server-hardening.yml'
      - '.github/workflows/ultimate-batch-15-integrated-server.yml'
      - 'tools/ultimate/batch_15_manifest.json'
      - 'tools/ultimate/test_batch_15_server_merge.py'
      - 'docs/ULTIMATE_BATCH_15.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimate-b15-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-merge-contract:
    # Original B14->B15 22-file allowlist belongs to Draft PR #47 only.
    # Descendant server patches keep their own precise parent diff and C++ tests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'experiment/ultimate-batch-14-integrated-windows-native-20261109')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify 22-file exact B14-to-B15 server-only and CI diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 'c298d66de8afafb9138a804377e36afb0b7332e3' HEAD > /tmp/b15-changed.txt
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('tools/ultimate/batch_15_manifest.json').read_text())
          expected=set(m['server_source_overlay_changed_paths'])|{
            '.github/workflows/ultimate-batch-15-integrated-server.yml',
            'tools/ultimate/batch_15_manifest.json',
            'tools/ultimate/test_batch_15_server_merge.py',
            'docs/ULTIMATE_BATCH_15.md',
          }
          changed=set(Path('/tmp/b15-changed.txt').read_text().splitlines())
          assert len(expected)==22 and changed==expected,(sorted(changed-expected),sorted(expected-changed))
          print('B15_EXACT_22_PATHS_SERVER_INTEGRATION_PASS')
          PY
      - name: Verify both Git merge parents, server code SHAs and newest reliable join data
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ultimate -p 'test_batch_15_server_merge.py' -v
          python3 -m unittest discover -s tools/re/tests -p 'test_member_data_slot_guard.py' -v
          python3 -m unittest discover -s tools/re/tests -p 'test_encounter_insight_owner.py' -v
          echo 'B15_REAL_TWO_PARENT_MERGE_AND_CLIENT_CPP_FIXTURES_PASS'
      - name: Verify source-level original five-hunter owner and team bounds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('server/loadtest/bbload.cpp').read_text()
          for pattern in (
            r'\{"owners",\s*"seats a team that own enemies',
            r'bool Game::Owner\(\) const \{ return seat < load.settings.owners; \}',
            r'settings.team_size = std::clamp\(parser.value\("team-size"\).toInt\(\), 2, 5\);',
            r'settings.owners = std::clamp\(parser.value\("owners"\).toInt\(\), 0,\s*settings.team_size\);',
          ):
            assert re.search(pattern,s),pattern
          print('B15_5_HUNTER_OWNER_RANGE_SOURCE_PASS')
          PY

  server-native-contracts:
    needs: verified-merge-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real server C++20 Qt6 test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ pkg-config qt6-base-dev
      - name: Compile and run real server admission + shared NAT tests
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -fPIC -pthread -Iserver/src \
            server/tests/test_admission.cpp server/src/admission.cpp \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) -o /tmp/b15_test_admission
          timeout 30s /tmp/b15_test_admission
      - name: Compile and run encrypted peer packet and connection tests
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -fPIC -pthread -Iserver/src -Iserver \
            -DBLOODBORNE_SERVER_LINK_CONTRACTS="\"$PWD/server/tests/contracts/server_link_frames.txt\"" \
            server/tests/test_server_link.cpp server/src/server_link.cpp \
            server/coop/link_crypto.cpp \
            $(pkg-config --cflags --libs Qt6Core Qt6Network) -o /tmp/b15_test_server_link
          timeout 30s /tmp/b15_test_server_link
      - name: Compile and run server watchdog
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -fPIC -pthread -Iserver/src \
            server/tests/test_watchdog.cpp server/src/watchdog.cpp \
            $(pkg-config --cflags --libs Qt6Core) -o /tmp/b15_test_watchdog
          timeout 30s /tmp/b15_test_watchdog
          echo 'B15_NATIVE_SERVER_NETWORK_ADMISSION_WATCHDOG_PASS'

  docker-server-and-5p:
    needs: server-native-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch only protobuf build dependency
        run: git submodule update --init --depth=1 server/externals/protobuf
      - uses: docker/setup-buildx-action@v3
      - name: Run actual 12 server test suites inside isolated Docker build
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --build-arg BUILD_JOBS=2 \
            -f server/hosting/Dockerfile --target verification-tests \
            -t yharnam-ultimate-b15:server-tests .
          echo 'B15_DOCKER_12_SERVER_SUITES_PASS'
      - name: Build disposable server and encrypted-link load generator
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --build-arg BUILD_JOBS=2 \
            -f server/hosting/Dockerfile --target loadtest \
            -t yharnam-ultimate-b15:synthetic-hunters .
          DOCKER_BUILDKIT=1 docker build --build-arg BUILD_JOBS=2 \
            -f server/hosting/Dockerfile --target runtime \
            -t yharnam-ultimate-b15:disposable-server .
          docker image inspect yharnam-ultimate-b15:disposable-server \
            --format 'B15_EPHEMERAL_IMAGE user={{.Config.User}}'
      - name: Test 5 encrypted synthetic hunters in disposable internal-only network
        run: |
          set -euo pipefail
          network=b15-shadnet-test
          volume=b15-worlds-disposable
          server=b15-shadnet-ephemeral
          cleanup() {
            docker rm -f "$server" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$network" >/dev/null
          docker volume create "$volume" >/dev/null
          docker run -d --name "$server" --network "$network" \
            --memory=2g --pids-limit=4096 --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=volume,src=$volume,dst=/data" \
            -e SIGN_IN=open -e SHADNET_BUILD=bbload \
            yharnam-ultimate-b15:disposable-server >/dev/null
          healthy=false
          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$server" 2>/dev/null || true)"
            if [ "$state" = healthy ]; then healthy=true; break; fi
            if [ "$state" = unhealthy ] || [ "$state" = exited ]; then break; fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            echo 'B15_FAIL: disposable server health check' >&2
            docker logs --tail 24 "$server" >&2 || true
            exit 1
          fi
          timeout 95s docker run --rm --network "container:$server" \
            --cap-drop ALL --security-opt no-new-privileges \
            yharnam-ultimate-b15:synthetic-hunters \
            --server 127.0.0.1 --port 31314 \
            --teams 1 --team-size 5 --owners 3 \
            --seconds 55 --ramp-ms 120 --owner-fps 12 --follower-fps 4 \
            --one-address --map-changes 0 --json \
            > "$RUNNER_TEMP/b15-five.json"
          python3 - "$RUNNER_TEMP/b15-five.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text().strip())
          fields=('games','linked','playing','refused','packets_received','relay_ms_p95','relay_ms_p99','ping_ms_p99')
          print('B15_SYNTHETIC_5_HUNTER_METRICS',json.dumps({k:r.get(k) for k in fields},sort_keys=True))
          assert r.get('games')==5 and r.get('linked')==5 and r.get('playing')==5
          assert r.get('refused')==0
          assert r.get('packets_received',0)>0
          print('B15_5_SYNTHETIC_HUNTERS_LINK_RELAY_PASS_NOT_REAL_GAME')
          PY
      - name: Explicitly no live deployment or release
        run: echo 'B15_NO_FORNEX_NO_PRIVATE_GAMES_NO_PUBLIC_BINARIES_NO_RELEASE'
