name: Shared GameLink reliable ACK window

on:
  pull_request:
    paths:
      - 'server/coop/game_link.h'
      - 'server/tests/test_game_link_ack_window.cpp'
      - '.github/workflows/gamelink-ack-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-ack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Native shared GameLink test (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-missing-field-initializers -pedantic \
            -Iserver server/tests/test_game_link_ack_window.cpp -o "$RUNNER_TEMP/gamelink-ack"
          "$RUNNER_TEMP/gamelink-ack"
      - name: Native shared GameLink test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /Iserver server\tests\test_game_link_ack_window.cpp /Fe:%RUNNER_TEMP%\gamelink-ack.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\gamelink-ack.exe"
