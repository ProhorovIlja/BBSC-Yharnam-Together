name: Ultimate B86 guest solo world / team flag isolation
on:
  pull_request:
    paths:
      - 'emulator/src/core/bloodborne_flags_store.cpp'
      - 'emulator/src/core/bloodborne_team.cpp'
      - 'emulator/src/core/bloodborne_team.h'
      - 'emulator/src/core/bloodborne_server_world.cpp'
      - 'emulator/src/core/bloodborne_re_internal.h'
      - 'emulator/tests/bloodborne/test_bloodborne_team.cpp'
      - 'tools/ultimate/test_batch_86_solo_guest_world.py'
      - '.github/workflows/ultimate-batch-86-solo-world-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integration-and-production-extracted-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual source call sites and flag ownership boundaries
        shell: bash
        run: |
          python -m unittest discover -s tools/ultimate -p 'test_batch_86_solo_guest_world.py' -v
          python -m py_compile tools/ultimate/test_batch_86_solo_guest_world.py
      - name: Prepare C++ native test from actual production function
        shell: bash
        run: |
          python tools/ultimate/test_batch_86_solo_guest_world.py \
            --extract-native "$RUNNER_TEMP/b86_policy.cpp"
      - name: Linux GCC and Clang compile and run extracted real predicate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for cxx in g++ clang++; do
            "$cxx" -std=c++23 -O2 -Wall -Wextra -Werror -pedantic \
              "$RUNNER_TEMP/b86_policy.cpp" -o "$RUNNER_TEMP/b86-TEST"
            "$RUNNER_TEMP/b86-TEST"
          done
          echo B86_EXTRACTED_NATIVE_WORLD_ISOLATION_PASS
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows MSVC compile and run extracted real predicate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++latest /EHsc /W4 "$env:RUNNER_TEMP\b86_policy.cpp" /Fe:"$env:RUNNER_TEMP\b86_policy.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\b86_policy.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "B86_EXTRACTED_NATIVE_WORLD_ISOLATION_PASS"
