name: Ultimate world and shared game link

on:
  pull_request:
    paths:
      - server/coop/**
      - server/loadtest/**
      - bbport/tools/bench.sh
      - server/tests/test_game_link_restart.cpp
      - server/tests/test_game_link_resend.cpp
      - server/tests/test_game_link_allocations.cpp
      - emulator/src/core/bloodborne_game_link.h
      - emulator/tests/bloodborne/test_bloodborne_game_link.cpp
      - emulator/src/core/bloodborne_team.*
      - emulator/src/core/bloodborne_game_server.h
      - emulator/src/core/libraries/network/http.cpp
      - emulator/src/core/bloodborne_server_world.cpp
      - emulator/src/core/bloodborne_travel.cpp
      - tools/re/tests/test_team_world_preservation.py
      - tools/re/tests/fixtures/team_world.cpp.in
      - tools/re/tests/test_team_travel_locking.py
      - tools/re/tests/fixtures/team_travel.cpp.in
      - tools/rig/**
      - tools/ultimate/network-tests/**
      - .github/workflows/ultimate-game-link.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultimate-game-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: GoogleTest v1.17.0 (pinned source)
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          ref: 52eb8108c5bdec04579160ae17225d66034bd723
          path: .ci/googletest
      - name: Configure real shared-header tests without game assets or Qt
        run: cmake -S tools/ultimate/network-tests -B build-game-link -DULTIMATE_GTEST_SOURCE=${{ github.workspace }}/.ci/googletest
      - name: Build
        run: cmake --build build-game-link --config Release --parallel 2
      - name: Test world preservation, reliable delivery and restart isolation
        run: ctest --test-dir build-game-link -C Release --output-on-failure --verbose
      - name: Existing RE regression suite (four retail-file checks may skip)
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tools/re/tests -p "test_*.py" -v
      - name: Cross-platform rig scenario and socket lifecycle tests
        run: python -m unittest discover -s tools/rig/tests -p "test_*.py" -v
      - name: Load-test worker failure, deadlines and cleanup
        run: python -m unittest discover -s server/loadtest -p "test_*.py" -v
      - name: Check client benchmark shell syntax
        shell: bash
        run: bash -n bbport/tools/bench.sh
