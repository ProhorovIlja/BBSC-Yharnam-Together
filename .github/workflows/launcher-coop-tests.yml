name: Launcher co-op regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'bbport/launcher/**'
      - 'bbport/tests/test_coop_launcher.py'
      - 'bbport/tests/test_launcher_lag.py'
      - 'bbport/tests/test_launcher_auth.py'
      - '.github/workflows/launcher-coop-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coop-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s bbport/tests -p test_coop_launcher.py -v
      - name: Mock UPnP gateway, public unicast and reserved-WAN refusal
        run: python -m unittest discover -s bbport/tests -p test_launcher_upnp.py -v
      - name: Support archive privacy and credential redaction
        run: python -m unittest discover -s bbport/tests -p test_support_bundle.py -v
      - name: HTTPS account integration and refusal regressions
        if: runner.os == 'Linux'
        run: python -m unittest discover -s bbport/tests -p test_launcher_auth.py -v
      - name: Windows launcher worker lifecycle regressions
        if: runner.os == 'Windows'
        run: python -m unittest discover -s bbport/tests -p test_launcher_lag.py -k WorkerLifecycleTests -v
