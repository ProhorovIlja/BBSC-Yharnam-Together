name: Bounded local RPC replies

on:
  pull_request:
    paths:
      - 'emulator/src/core/libraries/network/rpc_local_send.h'
      - 'emulator/src/core/libraries/network/rpc_bridge.cpp'
      - 'server/tests/test_rpc_local_send.cpp'
      - 'server/tests/test_rpc_local_send_windows.cpp'
      - '.github/workflows/rpc-local-send.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-local-socket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: POSIX cancelled, stalled and closed local TCP tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -Iemulator/src server/tests/test_rpc_local_send.cpp -o "$RUNNER_TEMP/rpc-local-send"
          "$RUNNER_TEMP/rpc-local-send"

  windows-socket-options:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and verify Winsock send timeout
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /Iemulator\src server\tests\test_rpc_local_send_windows.cpp /Fe:%RUNNER_TEMP%\rpc-local-win.exe ws2_32.lib
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\rpc-local-win.exe"
