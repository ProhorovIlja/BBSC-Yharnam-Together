name: Bounded ShadNet TCP ingress

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/src/bounded_socket_drain.h'
      - 'server/src/client_session.cpp'
      - 'server/tests/test_bounded_socket_drain.cpp'
      - 'server/CMakeLists.txt'
      - '.github/workflows/bounded-shadnet-ingress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-buffer-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt6Core and C++20 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev pkg-config
      - name: Compile with release assertions disabled
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror \
            -Iserver/src server/tests/test_bounded_socket_drain.cpp \
            $(pkg-config --cflags --libs Qt6Core) -o /tmp/test_bounded_socket_drain
      - name: Verify eight-megabyte stream ordering and 16-KiB read ceiling
        run: /tmp/test_bounded_socket_drain
