name: Playable Windows build

on:
  pull_request:
    branches: [architecture/seamlesshunt-ultimate-playable-contract-20261115]
    paths:
      - 'bbport/**'
      - 'emulator/**'
      - 'server/coop/**'
      - '.github/workflows/playable-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-client:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-abseil-cpp
      - name: Build and link playable production binaries without game files
        shell: msys2 {0}
        env:
          BB_PRODUCTION: '1'
        run: |
          set -euo pipefail
          bash bbport/build.sh
          test "$(cat bbport/out/build-mode.txt)" = production
          for exe in bb-probe bb-gpu-capabilities bb-play; do
            test -s "bbport/out/$exe.exe"
          done
          sha256sum bbport/out/*.exe > bbport/out/client-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playable-windows-build-evidence
          path: |
            bbport/out/gpu-build.log
            bbport/out/build-mode.txt
            bbport/out/client-sha256.txt
          retention-days: 7
