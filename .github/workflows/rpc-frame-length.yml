name: RPC adapter frame boundary

on:
  pull_request:
    paths:
      - 'emulator/src/core/libraries/network/rpc_frame_length.h'
      - 'emulator/src/core/libraries/network/rpc_bridge.cpp'
      - 'server/tests/test_rpc_frame_length.cpp'
      - 'server/tests/test_rpc_bridge_invalid_length.cpp'
      - '.github/workflows/rpc-frame-length.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux real bridge and boundary tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -Iemulator/src server/tests/test_rpc_frame_length.cpp -o "$RUNNER_TEMP/bound"
          "$RUNNER_TEMP/bound"
          c++ -std=c++20 -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Wno-missing-field-initializers \
            -Iserver/tests/rpc_bridge_fixture -Iemulator/src -Iserver \
            server/tests/test_rpc_bridge_invalid_length.cpp emulator/src/core/libraries/network/rpc_bridge.cpp -o "$RUNNER_TEMP/adapter"
          "$RUNNER_TEMP/adapter"
      - name: Windows real bridge and boundary tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /Iemulator\src server\tests\test_rpc_frame_length.cpp /Fe:%RUNNER_TEMP%\bound.exe
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\bound.exe"
          cl /nologo /std:c++20 /W4 /WX /EHsc /Iserver\tests\rpc_bridge_fixture /Iemulator\src /Iserver server\tests\test_rpc_bridge_invalid_length.cpp emulator\src\core\libraries\network\rpc_bridge.cpp /Fe:%RUNNER_TEMP%\adapter.exe ws2_32.lib
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\adapter.exe"
